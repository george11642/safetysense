<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">SafetySense system architecture</title>
  <desc id="d">On-device sensing, risk engine and escalation on the iPhone; a Supabase edge function, Postgres, Vault, pg_cron watchdog and private evidence storage on the server; Twilio, Noonlight and a Vercel live-link page reaching trusted contacts and professional dispatch.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap");
      .bg { fill: #14131f; }
      .panel { fill: #1a1928; stroke-width: 1.5; }
      .p-pink { stroke: #ef7b9b; stroke-opacity: .55; }
      .p-teal { stroke: #5cc7b2; stroke-opacity: .55; }
      .box { fill: #211f31; stroke: #34314a; stroke-width: 1.2; }
      .box-pink { fill: #2c1f2c; stroke: #ef7b9b; stroke-width: 1.6; }
      .box-teal { fill: #1c2a2b; stroke: #5cc7b2; stroke-width: 1.4; }
      .box-amber { fill: #2b251c; stroke: #f0b55a; stroke-width: 1.4; }
      .box-people { fill: #f1eff8; stroke: none; }
      .box-dash { fill: #211f31; stroke: #a19fb6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .h { font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 14.5px; fill: #f1eff8; }
      .hb { font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #f1eff8; }
      .s { font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; fill: #a19fb6; }
      .s-ink { font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; fill: #d9d6e6; }
      .dark { fill: #14131f; }
      .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; letter-spacing: .08em; }
      .lab-pink { fill: #ef7b9b; }
      .lab-teal { fill: #5cc7b2; }
      .lab-amber { fill: #f0b55a; }
      .lab-muted { fill: #a19fb6; }
      .ar { fill: none; stroke: #c9c6d8; stroke-width: 1.6; }
      .ar-pink { fill: none; stroke: #ef7b9b; stroke-width: 2; }
      .ar-teal { fill: none; stroke: #5cc7b2; stroke-width: 1.8; }
      .ar-amber { fill: none; stroke: #f0b55a; stroke-width: 1.8; }
      .ar-dash { fill: none; stroke: #a19fb6; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .lvl { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10.5px; fill: #f1eff8; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9c6d8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef7b9b"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5cc7b2"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0b55a"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a19fb6"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <!-- header -->
  <text class="hb" x="28" y="42">SafetySense · system architecture</text>
  <text class="m lab-muted" x="1172" y="42" text-anchor="end">AUDIO, SPEECH &amp; AI NEVER LEAVE THE PHONE WHILE GUARDING</text>

  <!-- ================= iPhone panel ================= -->
  <rect class="panel p-pink" x="24" y="64" width="520" height="634" rx="16"/>
  <text class="m lab-pink" x="44" y="90">IPHONE · ON-DEVICE · SWIFT 6 / SWIFTUI · iOS 26</text>

  <!-- sensors -->
  <text class="m lab-muted" x="44" y="114">SIGNALS</text>
  <rect class="box" x="44" y="122" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="145">AVAudioEngine</text>
  <text class="s" x="58" y="163">mic only during Guard · 30 s RAM buffer</text>

  <rect class="box" x="44" y="188" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="211">SoundAnalysis</text>
  <text class="s" x="58" y="229">scream · shout · glass · thud</text>

  <rect class="box" x="44" y="254" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="277">Speech · SpeechAnalyzer</text>
  <text class="s" x="58" y="295">safe word · distress phrases (offline)</text>

  <rect class="box" x="44" y="320" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="343">CoreMotion</text>
  <text class="s" x="58" y="361">fall · impact · long stillness</text>

  <rect class="box" x="44" y="386" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="409">CoreLocation</text>
  <text class="s" x="58" y="427">CLServiceSession · CLMonitor · route</text>

  <rect class="box" x="44" y="452" width="210" height="56" rx="9"/>
  <text class="h" x="58" y="475">Check-ins</text>
  <text class="s" x="58" y="493">missed "You okay?" · no response</text>

  <!-- bus into risk engine -->
  <path class="ar" d="M254 150 H274 M254 216 H274 M254 282 H274 M254 348 H274 M254 414 H274 M254 480 H274 M274 150 V480"/>
  <path class="ar" d="M274 250 H292" marker-end="url(#a)"/>

  <!-- foundation models -->
  <rect class="box-dash" x="296" y="122" width="200" height="62" rx="9"/>
  <text class="h" x="310" y="145">FoundationModels</text>
  <text class="s" x="310" y="163">on-device LLM second opinion</text>
  <text class="s" x="310" y="177">bounded ±25% · never sole trigger</text>
  <path class="ar-dash" d="M396 184 V208" marker-end="url(#ad)"/>

  <!-- risk engine -->
  <rect class="box-pink" x="296" y="212" width="200" height="74" rx="10"/>
  <text class="h" x="310" y="237">Risk engine</text>
  <text class="s-ink" x="310" y="255">weighted, decaying, explainable</text>
  <text class="s-ink" x="310" y="271">rules · mode &amp; time aware</text>
  <path class="ar-pink" d="M396 286 V306" marker-end="url(#ap)"/>

  <!-- escalation -->
  <rect class="box-pink" x="296" y="310" width="200" height="124" rx="10"/>
  <text class="h" x="310" y="334">Escalation ladder</text>
  <text class="lvl" x="310" y="356">L0  Guarding</text>
  <text class="lvl" x="310" y="373">L1  Check-in · 45 s</text>
  <text class="lvl" x="310" y="390">L2  Alert contacts</text>
  <text class="lvl" x="310" y="407">L3  Dispatch · after 90 s</text>
  <text class="s-ink" x="310" y="425">Safety PIN · duress PIN</text>
  <path class="ar-pink" d="M396 434 V458" marker-end="url(#ap)"/>
  <text class="m lab-pink" x="404" y="451">L2+</text>

  <!-- vault -->
  <rect class="box" x="296" y="462" width="200" height="66" rx="9"/>
  <text class="h" x="310" y="485">Evidence vault</text>
  <text class="s" x="310" y="503">CryptoKit AES-GCM · Keychain key</text>
  <text class="s" x="310" y="519">SHA-256 per chunk · Face ID</text>

  <!-- system surfaces -->
  <text class="m lab-muted" x="44" y="560">TRIGGERS IN · STATUS OUT</text>
  <rect class="box" x="44" y="568" width="452" height="112" rx="10"/>
  <text class="h" x="58" y="592">Widgets, intents &amp; Live Activity</text>
  <text class="s-ink" x="58" y="614">AppIntents: Action Button · Siri "SafetySense alert"</text>
  <text class="s-ink" x="58" y="632">WidgetKit ControlWidget: Lock Screen / Control Center SOS</text>
  <text class="s-ink" x="58" y="650">ActivityKit: Live Activity &amp; Dynamic Island, "I'm okay" button</text>
  <text class="s-ink" x="58" y="668">UserNotifications (Time-Sensitive) · LocalAuthentication</text>
  <path class="ar" d="M496 600 H518 V380 H500" marker-end="url(#a)"/>

  <!-- phone -> api -->

  <!-- ================= Supabase panel ================= -->
  <rect class="panel p-teal" x="588" y="64" width="276" height="634" rx="16"/>
  <text class="m lab-teal" x="606" y="90">SUPABASE · SERVER</text>

  <rect class="box" x="606" y="104" width="240" height="78" rx="9"/>
  <text class="h" x="620" y="127">Supabase Vault</text>
  <text class="s" x="620" y="145">Twilio &amp; Noonlight credentials</text>
  <text class="s" x="620" y="161">cron secret · AES-256 key for</text>
  <text class="s" x="620" y="175">sealed date details</text>

  <rect class="box" x="606" y="196" width="240" height="96" rx="9"/>
  <text class="h" x="620" y="219">Postgres</text>
  <text class="s" x="620" y="237">RLS on, no policies: service role only</text>
  <text class="s" x="620" y="253">devices · contacts · sessions</text>
  <text class="s" x="620" y="269">alerts · locations · events</text>
  <text class="s" x="620" y="285">PII-minimal, cascade delete</text>

  <path class="ar-teal" d="M726 306 V296" marker-end="url(#at)"/>
  <rect class="box-teal" x="606" y="308" width="240" height="122" rx="10"/>
  <text class="h" x="620" y="332">Edge Function "api"</text>
  <text class="s-ink" x="620" y="350">TypeScript on Deno · one function</text>
  <text class="s-ink" x="620" y="366">hashed device secrets, constant-time</text>
  <text class="s-ink" x="620" y="382">Twilio webhook signature check</text>
  <text class="s-ink" x="620" y="398">6 live alerts/h · ≤5 contacts · US only</text>
  <text class="s-ink" x="620" y="414">duress cancel → silent escalation</text>

  <rect class="box" x="606" y="456" width="240" height="96" rx="9"/>
  <text class="h" x="620" y="479">pg_cron + pg_net</text>
  <text class="s" x="620" y="497">watchdog every 60 s: heartbeat lost</text>
  <text class="s" x="620" y="513">→ Alert at last known location;</text>
  <text class="s" x="620" y="529">Alert 90 s, no cancel → dispatch</text>
  <text class="s" x="620" y="545">retention: locations deleted at 30 days</text>
  <path class="ar-teal" d="M726 456 V434" marker-end="url(#at)"/>

  <rect class="box" x="606" y="572" width="240" height="66" rx="9"/>
  <text class="h" x="620" y="595">Storage · private "evidence"</text>
  <text class="s" x="620" y="613">client-side ciphertext + SHA-256</text>
  <text class="s" x="620" y="629">server never holds the key</text>
  <path class="ar-teal" d="M606 418 H596 V605 H602" marker-end="url(#at)"/>

  <text class="m lab-pink" x="566" y="330" text-anchor="middle">HTTPS</text>
  <text class="m lab-pink" x="566" y="358" text-anchor="middle">JSON</text>

  <!-- ================= Third parties ================= -->
  <text class="m lab-amber" x="910" y="90">THIRD-PARTY SERVICES &amp; PEOPLE</text>

  <!-- trusted contacts -->
  <rect class="box-people" x="910" y="104" width="266" height="84" rx="10"/>
  <text class="h dark" x="926" y="129">Trusted contacts (1–5)</text>
  <text class="s dark" x="926" y="148" style="fill:#3d3a52">no app needed: a phone call, a text,</text>
  <text class="s dark" x="926" y="164" style="fill:#3d3a52">and a live link in any browser</text>
  <text class="s dark" x="926" y="180" style="fill:#3d3a52">"I'm on my way" · "Send help"</text>

  <!-- twilio -->
  <rect class="box-amber" x="910" y="296" width="266" height="92" rx="10"/>
  <text class="h" x="926" y="320">Twilio Programmable Voice + SMS</text>
  <text class="s-ink" x="926" y="338">automated call per contact:</text>
  <text class="s-ink" x="926" y="354">press 1 = on my way · 9 = send help</text>
  <text class="s-ink" x="926" y="370">SMS with the live link</text>
  <path class="ar-amber" d="M1043 296 V194" marker-end="url(#aa)"/>
  <text class="m lab-amber" x="1052" y="248">CALL · SMS</text>

  <!-- noonlight -->
  <rect class="box-amber" x="910" y="414" width="266" height="98" rx="10"/>
  <text class="h" x="926" y="438">Noonlight Dispatch API</text>
  <text class="s-ink" x="926" y="456">professional monitoring calls the user,</text>
  <text class="s-ink" x="926" y="472">then routes police to the live location</text>
  <text class="s-ink" x="926" y="488">sandbox in the demo, never live 911;</text>
  <text class="s-ink" x="926" y="504">"simulated" fallback if no token</text>

  <!-- vercel -->
  <rect class="box-amber" x="910" y="560" width="266" height="88" rx="10"/>
  <text class="h" x="926" y="584">Vercel · live-link page</text>
  <text class="s-ink" x="926" y="602">/a/&lt;token&gt; · 24 random bytes per alert</text>
  <text class="s-ink" x="926" y="618">expires 2 h after cancel, 48 h max</text>
  <text class="s-ink" x="926" y="634">calls share/get · share/action</text>

  <!-- api -> twilio -->
  <path class="ar-amber" d="M846 336 H906" marker-end="url(#aa)"/>
  <!-- api -> noonlight -->
  <path class="ar-amber" d="M846 372 H890 V462 H906" marker-end="url(#aa)"/>
  <text class="m lab-amber" x="894" y="420">L3</text>
  <!-- vercel -> api -->
  <path class="ar" d="M910 604 H872 V404 H850" marker-end="url(#a)"/>
  <!-- contacts open link -->
  <path class="ar" d="M1176 146 H1188 V604 H1180" marker-end="url(#a)"/>

  <path class="ar-pink" d="M496 340 H604" marker-end="url(#ap)"/>

  <!-- ================= legend ================= -->
  <rect x="24" y="716" width="1152" height="64" rx="12" fill="#1a1928"/>
  <path class="ar-pink" d="M44 740 H84" marker-end="url(#ap)"/><text class="s-ink" x="92" y="744">decision path (on the phone)</text>
  <path class="ar-teal" d="M290 740 H330" marker-end="url(#at)"/><text class="s-ink" x="338" y="744">server-side flow</text>
  <path class="ar-amber" d="M470 740 H510" marker-end="url(#aa)"/><text class="s-ink" x="518" y="744">outbound to third parties</text>
  <path class="ar-dash" d="M700 740 H740" marker-end="url(#ad)"/><text class="s-ink" x="748" y="744">optional (Apple Intelligence devices)</text>
  <text class="s" x="44" y="768">While guarding, the server receives only a heartbeat (time, location, battery). Audio, transcripts and AI reasoning stay on the iPhone; evidence leaves only as ciphertext after an Alert.</text>
</svg>
